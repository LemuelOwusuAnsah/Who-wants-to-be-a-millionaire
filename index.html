<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Wonders of the World Quiz · Millionaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at 20% 30%, #0b1c3a, #051024 90%);
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 12px;
    }

    .millionaire-container {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      background: rgba(10, 25, 50, 0.85);
      backdrop-filter: blur(6px);
      border: 2px solid #f5b342;
      border-radius: 40px 40px 30px 30px;
      box-shadow: 0 25px 40px -10px rgba(0,0,0,0.8), 0 0 0 2px #0a1428 inset;
      padding: 1.8rem 1.5rem 2rem;
      transition: all 0.2s;
    }

    @media (max-width: 576px) {
      .millionaire-container {
        padding: 1.2rem 1rem 1.5rem;
        border-radius: 30px 30px 20px 20px;
      }
    }

    .quiz-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge i {
      color: #f5b342;
      font-size: 2.1rem;
      filter: drop-shadow(0 0 6px #f5b34288);
    }

    .logo-badge span {
      font-weight: 800;
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: #f5e7c8;
      text-shadow: 0 2px 4px black;
    }

    .level-indicator {
      background: #0e203d;
      padding: 0.5rem 1.4rem;
      border-radius: 100px;
      border: 1px solid #f5b342;
      color: #f5e7c8;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 12px #f5b34233;
    }

    .level-indicator i {
      color: #f5b342;
    }

    .question-area {
      background: linear-gradient(145deg, #0a1e3c, #07162b);
      border: 2px solid #2d4c7a;
      border-radius: 30px;
      padding: 1.6rem 1.2rem;
      margin: 1rem 0 1.2rem;
      box-shadow: inset 0 0 20px #00000088, 0 8px 0 #020b16;
      transition: all 0.2s;
    }

    @media (max-width: 576px) {
      .question-area {
        padding: 1rem 0.8rem;
        border-radius: 24px;
      }
    }

    .question-text {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 0;
      text-shadow: 0 2px 5px black;
      word-break: break-word;
    }

    @media (max-width: 576px) {
      .question-text {
        font-size: 1.1rem;
      }
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 1.5rem 0 1.2rem;
    }

    .option-btn {
      background: linear-gradient(145deg, #142b4b, #0a1b30);
      border: 2px solid #3f6a9b;
      border-radius: 60px;
      padding: 0.9rem 1.2rem;
      color: #f0f4fc;
      font-weight: 500;
      font-size: 1.05rem;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
      box-shadow: 0 6px 0 #020b16, 0 4px 12px black;
      width: 100%;
      cursor: pointer;
      word-break: break-word;
    }

    .option-btn:hover:not(:disabled) {
      background: linear-gradient(145deg, #1d3d66, #0f2440);
      border-color: #f5b342;
      transform: scale(1.01);
    }

    .option-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .option-btn .option-letter {
      background: #0e1d33;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #f5b342;
      border: 1px solid #f5b34288;
      flex-shrink: 0;
      font-size: 1.2rem;
    }

    .option-btn.selected {
      background: #1e3a5e;
      border-color: #f5b342;
      box-shadow: 0 0 0 2px #f5b342, 0 6px 0 #020b16;
    }

    .option-btn.correct {
      background: #1e6b3b;
      border-color: #a5e0a5;
      box-shadow: 0 0 15px #35c96b, 0 6px 0 #0b3b1e;
      color: white;
    }

    .option-btn.wrong {
      background: #7a2e3a;
      border-color: #ff9e9e;
      box-shadow: 0 0 15px #d44, 0 6px 0 #421c22;
      color: #ffd9d9;
    }

    .option-btn.correct .option-letter,
    .option-btn.wrong .option-letter {
      background: #00000055;
      color: white;
      border-color: white;
    }

    .action-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 0.5rem;
    }

    .score-box {
      background: #07162b;
      border: 1px solid #f5b342;
      border-radius: 40px;
      padding: 0.5rem 1.5rem;
      color: #f5e7c8;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1px;
      box-shadow: inset 0 0 10px black;
    }

    .score-box i {
      color: #f5b342;
      margin-right: 6px;
    }

    .btn-millionaire {
      background: #f5b342;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 2rem;
      font-weight: 800;
      color: #0b1c3a;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 0 #9b6f1f, 0 6px 14px black;
      transition: 0.1s linear;
      border: 1px solid #ffd966;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-millionaire:hover:not(:disabled) {
      background: #ffc85e;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #9b6f1f, 0 8px 18px black;
    }

    .btn-millionaire:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #9b6f1f;
    }

    .btn-millionaire:disabled {
      opacity: 0.5;
      transform: translateY(0);
      box-shadow: 0 6px 0 #5e4213;
      cursor: not-allowed;
    }

    .feedback-message {
      font-weight: 600;
      padding: 0.6rem 1rem;
      border-radius: 40px;
      background: #0f213b;
      border-left: 6px solid #f5b342;
      color: #ffecb3;
      font-size: 0.95rem;
      margin-top: 0.5rem;
      width: 100%;
      text-align: center;
    }

    .progress {
      height: 10px;
      background: #0a1b30;
      border-radius: 20px;
      border: 1px solid #2d4c7a;
      margin: 1rem 0 0.2rem;
      overflow: hidden;
    }

    .progress-bar {
      background: linear-gradient(90deg, #f5b342, #ffd966);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 20px;
    }

    .footer-note {
      color: #6f8bb0;
      text-align: center;
      font-size: 0.75rem;
      margin-top: 1.2rem;
      letter-spacing: 0.5px;
    }

    .option-btn:disabled {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="millionaire-container">
    <div class="quiz-header">
      <div class="logo-badge">
        <i class="fas fa-globe-asia"></i>
        <span>WONDERS</span>
      </div>
      <div class="level-indicator" id="levelIndicator">
        <i class="fas fa-star"></i> Level 1 · Rookie
      </div>
    </div>

    <div class="question-area">
      <p class="question-text" id="questionText">Loading question...</p>
    </div>

    <div class="options-grid" id="optionsContainer">
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
    </div>

    <div class="action-area">
      <div class="score-box">
        <i class="fas fa-coins"></i> <span id="scoreDisplay">0</span>
      </div>
      <button class="btn-millionaire" id="nextBtn" disabled>
        Next <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <div class="feedback-message" id="feedbackMsg">Select an answer to begin</div>

    <div class="footer-note">
      <i class="fas fa-trophy"></i> Who wants to be a wonder-millionaire?
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      const levels = [
        {
          name: 'Level 1 · Rookie',
          questions: [
            { question: "Which ancient wonder was located in Babylon (modern Iraq)?", options: ["Hanging Gardens", "Great Pyramid", "Colossus of Rhodes", "Lighthouse of Alexandria"], correct: 0 },
            { question: "The Taj Mahal is located in which country?", options: ["India", "Pakistan", "Bangladesh", "Nepal"], correct: 0 },
            { question: "Which New7Wonders site is in Peru?", options: ["Machu Picchu", "Christ the Redeemer", "Chichen Itza", "Petra"], correct: 0 },
            { question: "The Great Wall of China was primarily built to protect against invasions from the north. True or false?", options: ["True", "False", "Only during Ming dynasty", "It was a trade route"], correct: 0 },
            { question: "The Colosseum is located in which city?", options: ["Rome", "Athens", "Cairo", "Istanbul"], correct: 0 },
            { question: "Which wonder is a massive stone statue in Rio de Janeiro?", options: ["Christ the Redeemer", "Statue of Liberty", "Colossus of Rhodes", "Moai"], correct: 0 },
            { question: "Petra, the rose-red city, is in which country?", options: ["Jordan", "Egypt", "Israel", "Lebanon"], correct: 0 },
            { question: "Which of these is one of the Seven Wonders of the Ancient World?", options: ["Statue of Zeus at Olympia", "Eiffel Tower", "Sydney Opera House", "Angkor Wat"], correct: 0 },
            { question: "Chichen Itza is a famous Mayan city in which country?", options: ["Mexico", "Guatemala", "Belize", "Honduras"], correct: 0 },
            { question: "The ancient Lighthouse of Alexandria was located in which country?", options: ["Egypt", "Greece", "Turkey", "Italy"], correct: 0 }
          ]
        },
        {
          name: 'Level 2 · Explorer',
          questions: [
            { question: "Which ancient wonder was a gigantic statue of the Greek sun god Helios?", options: ["Colossus of Rhodes", "Statue of Zeus", "Mausoleum at Halicarnassus", "Temple of Artemis"], correct: 0 },
            { question: "The Mausoleum at Halicarnassus was located in present-day which country?", options: ["Turkey", "Greece", "Egypt", "Italy"], correct: 0 },
            { question: "Which New7Wonders is an ancient city carved into rock in Jordan?", options: ["Petra", "Machu Picchu", "Chichen Itza", "Taj Mahal"], correct: 0 },
            { question: "The Great Pyramid of Giza was built as a tomb for which pharaoh?", options: ["Khufu", "Tutankhamun", "Ramesses II", "Cleopatra"], correct: 0 },
            { question: "Which wonder is a massive temple complex in Cambodia?", options: ["Angkor Wat", "Borobudur", "Shwedagon Pagoda", "Prambanan"], correct: 0 },
            { question: "The Leaning Tower of Pisa is located in which country?", options: ["Italy", "France", "Spain", "Greece"], correct: 0 },
            { question: "Which of these is NOT one of the original Seven Wonders of the Ancient World?", options: ["Great Wall of China", "Hanging Gardens", "Temple of Artemis", "Lighthouse of Alexandria"], correct: 0 },
            { question: "The Moai statues are found on which remote island?", options: ["Easter Island", "Hawaii", "Madagascar", "Socotra"], correct: 0 },
            { question: "The Hagia Sophia was originally built as a cathedral in which city?", options: ["Istanbul", "Athens", "Rome", "Cairo"], correct: 0 },
            { question: "Which New7Wonders is located in Italy?", options: ["Colosseum", "Leaning Tower of Pisa", "Taj Mahal", "Machu Picchu"], correct: 0 }
          ]
        },
        {
          name: 'Level 3 · Master',
          questions: [
            { question: "Which ancient wonder was destroyed by fire and later rebuilt, but eventually destroyed again?", options: ["Temple of Artemis", "Statue of Zeus", "Hanging Gardens", "Colossus of Rhodes"], correct: 0 },
            { question: "The Statue of Zeus at Olympia was made by which sculptor?", options: ["Phidias", "Praxiteles", "Myron", "Polykleitos"], correct: 0 },
            { question: "Which wonder is the only one of the original Seven still largely intact?", options: ["Great Pyramid of Giza", "Hanging Gardens", "Temple of Artemis", "Lighthouse of Alexandria"], correct: 0 },
            { question: "The ancient city of Petra was the capital of which civilization?", options: ["Nabataeans", "Romans", "Greeks", "Persians"], correct: 0 },
            { question: "Which New7Wonders was built in the 20th century?", options: ["Christ the Redeemer", "Machu Picchu", "Chichen Itza", "Petra"], correct: 0 },
            { question: "The Colossus of Rhodes stood for only about 54 years before it was destroyed by:", options: ["Earthquake", "Fire", "Invasion", "Flood"], correct: 0 },
            { question: "Which of these is a famous rock-cut temple in India?", options: ["Ajanta Caves", "Angkor Wat", "Borobudur", "Potala Palace"], correct: 0 },
            { question: "The Great Wall of China is approximately how long?", options: ["21,196 km", "5,000 km", "10,000 km", "50,000 km"], correct: 0 },
            { question: "Which wonder is a massive Buddhist temple in Indonesia?", options: ["Borobudur", "Angkor Wat", "Shwedagon", "That Luang"], correct: 0 },
            { question: "The Mausoleum at Halicarnassus was built for which ruler?", options: ["Mausolus", "Artemisia", "Xerxes", "Darius"], correct: 0 }
          ]
        }
      ];

      let currentLevel = 0;
      let currentQuestionIndex = 0;
      let score = 0;
      let answerSelected = false;
      let selectedOptionIndex = -1;
      let correctAnswerIndex = -1;

      const questionTextEl = document.getElementById('questionText');
      const optionsContainer = document.getElementById('optionsContainer');
      const nextBtn = document.getElementById('nextBtn');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const feedbackMsg = document.getElementById('feedbackMsg');
      const levelIndicator = document.getElementById('levelIndicator');
      const progressBar = document.getElementById('progressBar');

      function updateUIForLevel() {
        const level = levels[currentLevel];
        levelIndicator.innerHTML = `<i class="fas fa-star"></i> ${level.name}`;
      }

      function loadQuestion() {
        const level = levels[currentLevel];
        const q = level.questions[currentQuestionIndex];
        questionTextEl.textContent = q.question;
        correctAnswerIndex = q.correct;

        answerSelected = false;
        selectedOptionIndex = -1;
        nextBtn.disabled = true;
        feedbackMsg.innerHTML = `Select an answer to begin`;

        optionsContainer.innerHTML = '';
        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.setAttribute('data-index', idx);
          btn.innerHTML = `<span class="option-letter">${letters[idx]}</span> <span>${opt}</span>`;
          btn.addEventListener('click', () => onOptionClick(idx));
          optionsContainer.appendChild(btn);
        });

        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.disabled = false;
          btn.classList.remove('correct', 'wrong', 'selected');
        });

        const perLevelTotal = 10;
        const progressPercent = (currentQuestionIndex / perLevelTotal) * 100;
        progressBar.style.width = progressPercent + '%';
      }

      function onOptionClick(index) {
        if (answerSelected) return;

        const level = levels[currentLevel];
        const q = level.questions[currentQuestionIndex];
        const isCorrect = (index === q.correct);

        answerSelected = true;
        selectedOptionIndex = index;

        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach((btn, i) => {
          btn.disabled = true;
          if (i === index) {
            btn.classList.add('selected');
          }
          if (i === q.correct) {
            btn.classList.add('correct');
          } else if (i === index && !isCorrect) {
            btn.classList.add('wrong');
          }
        });

        if (isCorrect) {
          score += 1;
          scoreDisplay.textContent = score;
          feedbackMsg.innerHTML = '<i class="fas fa-check-circle" style="color:#35c96b;"></i> Correct! Well done.';
        } else {
          feedbackMsg.innerHTML = `<i class="fas fa-times-circle" style="color:#ff6b6b;"></i> Incorrect. The correct answer was ${String.fromCharCode(65 + q.correct)}.`;
        }

        nextBtn.disabled = false;
      }

      function goToNext() {
        if (!answerSelected) return;

        const level = levels[currentLevel];
        const isLastQuestionInLevel = (currentQuestionIndex === level.questions.length - 1);

        if (!isLastQuestionInLevel) {
          currentQuestionIndex++;
          loadQuestion();
        } else {
          if (currentLevel < levels.length - 1) {
            currentLevel++;
            currentQuestionIndex = 0;
            progressBar.style.width = '0%';
            updateUIForLevel();
            loadQuestion();
            feedbackMsg.innerHTML = `Welcome to ${levels[currentLevel].name}. Keep going!`;
          } else {
            showFinalResults();
          }
        }
      }

      function showFinalResults() {
        nextBtn.disabled = true;
        optionsContainer.innerHTML = '';
        const totalQuestions = levels.reduce((acc, lvl) => acc + lvl.questions.length, 0);
        const message = `🎉 You've completed all levels! Your final score is ${score} out of ${totalQuestions}.`;
        questionTextEl.textContent = '🏆 Quiz Completed!';
        feedbackMsg.innerHTML = message;
        nextBtn.innerHTML = 'Restart <i class="fas fa-rotate-right"></i>';
        nextBtn.disabled = false;
        nextBtn.onclick = () => restartQuiz();
        progressBar.style.width = '100%';
      }

      function restartQuiz() {
        currentLevel = 0;
        currentQuestionIndex = 0;
        score = 0;
        answerSelected = false;
        selectedOptionIndex = -1;
        correctAnswerIndex = -1;

        scoreDisplay.textContent = '0';
        updateUIForLevel();
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
        nextBtn.onclick = goToNext;
        nextBtn.disabled = true;

        progressBar.style.width = '0%';
        loadQuestion();
        feedbackMsg.innerHTML = 'Select an answer to begin';
      }

      function initQuiz() {
        currentLevel = 0;
        currentQuestionIndex = 0;
        score = 0;
        scoreDisplay.textContent = '0';
        updateUIForLevel();
        nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right"></i>';
        nextBtn.onclick = goToNext;
        nextBtn.disabled = true;
        loadQuestion();
      }

      nextBtn.onclick = goToNext;
      initQuiz();
    })();
  </script>
</body>
</html>
