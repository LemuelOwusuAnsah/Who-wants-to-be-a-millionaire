<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="description" content="Who Wants to Be a Millionaire style quiz about the Wonders of the World">
  <title>Wonders of the World Quiz · Millionaire</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="millionaire-container">
    <header class="quiz-header">
      <div class="logo-badge">
        <i class="fas fa-globe-asia"></i>
        <span>WONDERS</span>
      </div>
      <div class="level-indicator" id="levelIndicator">
        <i class="fas fa-star"></i> Level 1 · Rookie
      </div>
    </header>

    <div class="status-bar">
      <div class="timer-display" id="timerDisplay">
        <i class="fas fa-clock"></i> <span id="timerValue">30</span>s
      </div>
      <div class="lifeline-area" id="lifelineArea">
        <button class="lifeline-btn" id="lifeline5050" title="50:50 - Remove two wrong answers">
          <i class="fas fa-percentage"></i> 50:50
        </button>
        <button class="lifeline-btn" id="lifelineSkip" title="Skip this question">
          <i class="fas fa-forward"></i> Skip
        </button>
      </div>
    </div>

    <div class="question-area">
      <p class="question-text" id="questionText">Loading question...</p>
    </div>

    <div class="options-grid" id="optionsContainer"></div>

    <div class="progress">
      <div class="progress-bar" id="progressBar" role="progressbar" style="width: 0%"></div>
    </div>

    <div class="action-area">
      <div class="score-box">
        <i class="fas fa-coins"></i> <span id="scoreDisplay">0</span>
      </div>
      <button class="btn-millionaire" id="nextBtn" disabled>
        Next <i class="fas fa-arrow-right"></i>
      </button>
    </div>

    <div class="feedback-message" id="feedbackMsg">Select an answer to begin</div>

    <footer class="footer-note">
      <i class="fas fa-trophy"></i> Who wants to be a wonder-millionaire?
    </footer>
  </div>

  <div class="game-over-overlay" id="gameOverOverlay">
    <div class="game-over-card">
      <h2 id="gameOverTitle">Time's Up!</h2>
      <p id="gameOverMessage">You ran out of time on this question.</p>
      <div class="final-score" id="gameOverScore">0</div>
      <p>out of 30</p>
      <button class="btn-millionaire" id="playAgainBtn">
        Play Again <i class="fas fa-rotate-right"></i>
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/data/questions.js"></script>
  <script src="js/utils/dom.js"></script>
  <script src="js/utils/timer.js"></script>
  <script src="js/core/gameState.js"></script>
  <script src="js/core/lifelines.js"></script>
  <script src="js/core/scoring.js"></script>
  <script src="js/ui/renderer.js"></script>
  <script src="js/ui/feedback.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
